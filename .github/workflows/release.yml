name: InfluxAdmin Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    name: Build Desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            bundles: nsis,msi

          - os: ubuntu-22.04
            platform: Linux
            bundles: deb,appimage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            libxdo-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build Desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload Desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: InfluxAdmin-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React
        run: npm run build

      - name: Package Web
        run: |
          cd dist
          zip -r ../InfluxAdmin-Web.zip .

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: InfluxAdmin-Web
          path: InfluxAdmin-Web.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - desktop
      - web

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release files
        run: find release-assets -type f

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: InfluxAdmin ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/**/*
